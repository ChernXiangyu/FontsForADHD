<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>顺读 · 阅读设置</title>
  <link rel="stylesheet" href="popup.css">
  <script src="engine.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header><div class="brand"><span class="mark" aria-hidden="true">顺</span><div><h1>顺读<span>READ AT YOUR PACE</span></h1><p>让文字，顺着你的节奏。</p></div></div><label class="switch" title="开启或恢复网页"><input id="enabled" type="checkbox" aria-label="开启阅读处理"><span></span></label></header>
  <main>
    <div class="context"><span class="dot"></span><span id="siteName">正在连接当前网页…</span><span id="scopeBadge">本站设置</span></div>
    <section class="preview-card" aria-label="实时预览"><div class="section-label"><span>阅读预览</span><button id="compare" type="button" aria-pressed="false">对照原文</button></div><div id="preview"><p id="previewZh"></p><p id="previewEn"></p></div><p class="preview-note">从一小段文字，找到舒服的感觉。</p></section>
    <section class="controls"><div class="section-label"><h2>字的样子</h2><span>中英分别选择</span></div><div class="grid"><label>中文字体<select id="chineseFont"><option value="serif">思源宋体</option><option value="sans">思源黑体</option><option value="original">网页原字体</option></select></label><label>英文字体<select id="englishFont"><option value="follow">跟随中文字体</option><option value="lexend">Lexend</option><option value="original">网页原字体</option></select></label></div></section>
    <section class="controls"><div class="section-label"><h2>给视线一些落点</h2><span>轻一点，也可以</span></div><div class="grid"><label>中文强调<select id="chineseMode"><option value="word">整词强调</option><option value="prefix">词首加粗</option><option value="off">关闭强调</option></select></label><label>英文强调<select id="englishMode"><option value="prefix">词首加粗</option><option value="off">关闭强调</option></select></label></div><fieldset><legend>强调强度</legend><div class="segments"><label><input type="radio" name="intensity" value="light"><span>轻</span></label><label><input type="radio" name="intensity" value="medium"><span>中</span></label><label><input type="radio" name="intensity" value="strong"><span>重</span></label></div></fieldset></section>
    <section class="controls spacing"><div class="section-label"><h2>留一点呼吸的空间</h2><button id="reset" type="button">恢复默认</button></div><label class="slider">正文字号<output id="fontSizeValue"></output><input id="fontSize" type="range" min="14" max="28" step="1"></label><label class="slider">行距<output id="lineHeightValue"></output><input id="lineHeight" type="range" min="1.3" max="2.4" step="0.05"></label><label class="slider">字距<output id="letterSpacingValue"></output><input id="letterSpacing" type="range" min="0" max="0.12" step="0.01"></label></section>
    <footer><label class="scope-label">保存范围<select id="scope"><option value="site">仅此网站</option><option value="global">全局默认</option></select></label><button id="inherit" type="button">本站跟随全局</button><p id="status" role="status" aria-live="polite">设置自动保存 · 字体与文字处理均在本地</p><a href="demo.html" target="_blank" rel="noopener">打开完整试读页 <span aria-hidden="true">↗</span></a></footer>
  </main>
</body>
</html>
